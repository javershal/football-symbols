[project]
name = "football-symbols"
version = "0.1.0"
description = "Scoreboard 2.0: every NFL drive as an emoji, as a static site"
authors = [
    { name = "javershal", email = "jza22092@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
]

[project.scripts]
football-symbols = "football_symbols:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "regex>=2026.9.29",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
